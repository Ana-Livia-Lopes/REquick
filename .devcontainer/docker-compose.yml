version: "3.8"

services:
  app:
    image: mcr.microsoft.com/devcontainers/php:8.2
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    ports:
      - "8000:8000"

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    ports:
      - "3306:3306"